      tags: [pipeline, ingest]

    - name: pipeline-sync-model-aliases
      entrypoint: src/qptiff_pipeline/flows/sync_model_aliases.py:sync_model_aliases
      description: "Mirror MLflow model aliases into lamindb (subscribe) + report drift."
      work_pool:
          name: vm-pool
      pull:
