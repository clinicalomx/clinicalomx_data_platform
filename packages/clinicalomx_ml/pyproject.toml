[project]
name = "clinical-roi"
version = "0.1.0"
description = "ROI detector (ultralytics YOLO or RF-DETR) for tissue sections and TMA grids in downsampled histology images"
readme = "README.md"
# Copyright 2026 ClinicalOMXLab
license = "Apache-2.0"
requires-python = ">=3.11"
# ONE DISTRIBUTION, TWO OBJECTIVES, ONE OPTIONAL TRAINING STACK (ROADMAP item 8).
#
# This replaced five distributions: this umbrella plus `croi-{general,core}-{inference,train}`,
# each with its own pyproject under roi_detection/objectives/<obj>/<mode>/. They bought one
# guarantee - an inference install cannot import the training stack, because the training MODULES
# were in a wheel it did not install - and cost a five-way version lockstep whose check was
# silently vacuous for the whole period the pre-rename paths stood (release-clinical-roi.yml, and
# the `uv version --project` walk-up trap its comment describes).
#
# That guarantee is now a static test, `roi_detection/tests/test_inference_has_no_train_stack.py`: nothing
# reachable from an objective's two entry points imports mlflow or its training stack, and no
# module in the inference layer imports either, bar the ones `KNOWN_MLFLOW_IN_INFERENCE` names
# and justifies - a list that is EMPTY today. The entry points are each objective's
# `models.registry` and the shared `croi.detection` detector seam, and the training half is a
# NAMED SET of modules rather than a directory. The IMAGE split is untouched and
# stays - it is load-bearing for a mechanical reason (an unprivileged apptainer sizes mksquashfs
# from node RAM, so a large image OOMs inside its own SLURM allocation). What changed with Phase 2
# is that ALL FOUR images now convert to a SIF: each train deployment's flow body comes from the
# wheel in its image, so `croi-core-train` needs one exactly as `croi-general-train` did.
#
# Base = what an INFERENCE image needs: the union of the two former inference members. `core`
# contributes the geometry stack (scipy/geopandas/shapely/pandas/matplotlib/spatialdata) that its
# `gridding` lattice fit and `dearray` need; a general-only image now carries those
# wheels too, which is the price of one distribution and is small beside torch and CUDA.
dependencies = [
    # Manifest/InputRef/materialize, the ROI<->Artifact wiring used by the inference-side
    # pipeline stages, and ModelRef pointer/retrieval. [models] adds mlflow for the
    # portable-checkpoint fallback when a ModelRef resolves MLflow-side.
    # NOTE ON [models]: it pulls mlflow, so `clinicalomx[models]` is itself a path by which an
    # inference install can import mlflow. The static test asserts the narrower property the
    # deleted wheel boundary actually guarded: this package's own inference modules do not import
    # it. `general/inference/serve.py` was the one exemption and Phase 1 deleted it, so the
    # exemption list is empty and a planted offender is what proves the test still detects one.
    # Phase 2 added no exemption: core's re-layered inference side imports mlflow nowhere.
    "clinicalomx[models]>=0.1,<0.2",
    # lamindb is PINNED EXACTLY and must match every other environment that touches the
    # clinicalOMx instance (clinicalomx-pipeline, clinicalomx, this wheel, the workers, the
    # bgnorm image). Two reasons a floor is not enough:
    #  - a package BEHIND the instance's DB schema (2.8.1) refuses to connect;
    #  - 2.8.x changed how Artifact.suffix is derived (CanonicalSuffix is MIME-based), so `.qptiff`
    #    records as "" where older versions wrote ".qptiff" - mixed versions left the instance
    #    holding both spellings and silently broke every filter(suffix=...) query.
    # Bump the instance and ALL pins together, then rebuild the SIFs and images.
    "lamindb==2.8.1",
    # In the SIF the hpc worker runs `prefect flow-run execute`, so prefect must be
    # present in the image (the wheel code itself does not import prefect). Keep aligned
    # with the Prefect server/worker version (currently 3.6.x).
    "prefect>=3.6,<4",
    # A WHEEL dependency since the Phase 1 re-layering: yaml was read only by the
    # digit-prefixed drivers, which shipped in no wheel, and `<obj>/data/dataset.py` and
    # `<obj>/_env.py` are modules. It resolved transitively through ultralytics and prefect
    # before, which is not a declaration. Both objectives read it now.
    "pyyaml>=6",
    # Declared since 0.3.4: the typed stage configs (`croi.config`, each objective's
    # `config.py`), the schemas and `croi.io.registries` import pydantic at module level, and
    # `croi.environment` imports pydantic-settings. Both resolved transitively through prefect
    # before, which is not a declaration. v2 is the API every import uses.
    "pydantic>=2",
    "pydantic-settings>=2",
    # THE TWO DETECTION FRAMEWORKS, side by side and neither privileged: `croi.detection.backends`
    # imports each only inside its own backend, and a champion records which one reads it. Both
    # are BASE dependencies because an inference image serves whichever champion is promoted.
    # RF-DETR's base install is its inference stack (transformers, supervision); its training
    # stack is the `rfdetr[train]` line in the `train` extra below.
    "ultralytics>=8.3",
    "rfdetr>=1.10,<2",
    "bioio-qptiff",
    "bioio>=3.3.0",
    "imageio>=2.37.3",
    "numpy>=1.26",
    "pillow>=10.0",
    "xarray>=2024.1",   # utils/image_preprocess (DataTree pyramids)
    "dask>=2024.1",
    "tifffile",         # utils/image_preprocess (smallest-scale read)
    # --- core's dearray + grid fitting (`croi.objectives.tma_core.{gridding,dearray,crops}`) ---
    "scipy>=1.11",
    "geopandas>=1.1.3",
    "shapely>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.8",      # gridding QA overlays (plot_grid); also what models/plots uses
    "spatialdata>=0.7.0",   # data/dearray dearray_sdata -> shapes
    # lamindb shells out to `pip freeze` for run environment tracking, so pip must exist in
    # every image. It used to arrive only by Tier 0 warming this umbrella's own dependencies.
    "pip>=26.1.1",
]

[project.optional-dependencies]
# The TRAINING stack, and the only thing separating a train image from an inference one now that
# the code ships in one wheel. `containers/objective.Dockerfile` installs `clinical-roi[train]`
# when MODE=train and bare `clinical-roi` otherwise.
#
# matplotlib is deliberately NOT repeated here: `croi.objectives.tma_core.gridding`'s QA overlays
# already make it a base dependency, so listing it would imply an inference image without it.
train = [
    "mlflow>=2.16",     # training run logging + model registration
    # RF-DETR's Lightning training stack (pytorch-lightning, torchmetrics, pycocotools, peft).
    # ultralytics needs no equivalent: it trains out of its base install.
    "rfdetr[train]>=1.10,<2",
]
notebooks = [
    "jupyter",
    "matplotlib",
    "spatialdata-plot>=0.3.4",
]

# Local development tooling. A GROUP rather than an extra, so `uv sync` installs it by default for
# a developer and no wheel can ever depend on it; `containers/base.Dockerfile` passes --no-dev.
# These were base dependencies of the metadata-only umbrella, which is how jupyter-adjacent tools
# reached the shared Tier 0 venv of all four production images (ROADMAP defect 4).
[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "dotenv>=0.9.9",
]

# Advertise the vocabulary EACH OBJECTIVE owns. Two rows, one table, one distribution:
# `clinicalomx.vocab.discover()` keys by `Vocabulary.owner` and falls back to the entry-point name
# only when the owner is empty, so the two objectives must keep distinct owner strings or one
# silently overwrites the other's declarations, and renaming a KEY here changes nothing. The owner
# strings `croi-general` and `croi-core` are persisted in the live instance and referenced from
# outside this repository; they did not change when the four member distributions went away.
[project.entry-points."clinicalomx.vocabulary"]
croi-general = "croi.objectives.tissue_objects.vocab:VOCAB"
croi-core = "croi.objectives.tma_core.vocab:VOCAB"

[tool.uv.sources]
clinicalomx = { path = "../clinicalomx" }
bioio-qptiff = { git = "https://github.com/rtubelleza/bioio-qptiff", tag = "v0.1.0" }
# Custom reader (clinicalomxdb) is provided by the host environment, not pinned here.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ONE SOURCE TREE, ONE TOP-LEVEL PACKAGE, ONE WHEEL: `roi_detection/src/croi`, with each objective
# under `croi/objectives/<obj>`. A single root also keeps the editable `.pth` lossless:
# `packages` is a {source root -> destination} map, and two roots sharing a destination once
# dropped one of them from every editable install. `roi_detection/tests/test_packaging.py` refuses that.
#
# CONFIGS SHIP IN THE WHEEL. `roi_detection/src/croi/objectives/<obj>/configs/*.yaml` is package
# DATA: `clinicalomx.stage_config_dir` prefers the `configs/` directory beside the calling file, so
# a stage reads its yaml out of site-packages with no repo checkout and no copy step in the image.
# hatchling includes every file under a `packages` entry, not only `*.py`, so no force-include is
# needed. `roi_detection/tests/test_packaging.py` asserts the two halves of that: the yaml sits under a declared
# `packages` root, and this target declares no `exclude`/`only-include` that would drop it.
[tool.hatch.build.targets.wheel]
packages = [
    "roi_detection/src/croi",
]

# The sdist ships the SOURCE and nothing else; nothing installs from an sdist here.
# `roi_detection/src` is the whole of it now: Phase 2 emptied `objectives/` of code, and the
# directory itself was removed 2026-10-07 with the working PNGs it held (lamindb has them).
[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "pyproject.toml",
    "uv.lock",
    "roi_detection/src",
]
