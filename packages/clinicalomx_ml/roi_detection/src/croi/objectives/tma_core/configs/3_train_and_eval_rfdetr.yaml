# Run this stage with: python -m croi tma_core train --config 3_train_and_eval_rfdetr.yaml
#
# One flow, two steps (train_model -> evaluate_model) over the core splits.
# data_dir is the TRANSIENT experiment area under the storage root
# (<storage_root>/ml_experiments): base_models/, runs/, _dataset/, models/,
# artifacts/. Only the governed outputs below are registered to lamindb.
data_dir: ml_experiments

inputs:
  train_split: {kind: collection, key: clinical-roi/core/splits/train}
  val_split:   {kind: collection, key: clinical-roi/core/splits/val}
  test_split:  {kind: collection, key: clinical-roi/core/splits/test}
  categories:  {kind: artifact,   key: core_labels/notes.json}

outputs:
  model:
    key: models/core/best.pt                          # stable key; lamindb cuts versions
    description: "champion for core (full_core / partial_core) detection"
  metrics:
    key: "eval/core/v{version}/{view}/metrics.json"   # {version}=champion ver, {view}=test|all
    description: "Eval metrics (recall + IoU) for the core champion"
  contact_sheet:
    key: "eval/core/v{version}/{view}/worst_predictions.png"
    description: "Worst-prediction contact sheet for the core champion"

parameters:
  # v2: the same data, splits and eval as 3_train_and_eval.yaml, trained with RF-DETR.
  # Selected by name: `python -m croi tma_core train --config 3_train_and_eval_rfdetr.yaml`, or the
  # train-core deployment's `config` parameter. Its own `name`, so the two never share a run
  # dir or resume into each other; both register as versions of roi-core, and which one
  # production runs is the alias, never this file.
  framework: rfdetr
  name: rfdetr_nano_roi_core
  rfdetr_model_name: rf-detr-nano.pth   # published COCO-pretrained base, saved in base_models/
  mlflow_experiment_name: clinical-roi/core-train

  resume: auto

  # `train:` is passed VERBATIM to RFDETR.train, so these are RF-DETR's keywords, not
  # ultralytics'. There is no mosaic/hsv block: RF-DETR's own default augmentation applies.
  train:
    epochs: 200
    resolution: 640   # the imgsz every production caller passes (dearray: 640); an RF-DETR
                      # checkpoint does not record it, so a caller must ask for it
    multi_scale: false   # rfdetr defaults it on, which trains a 640 nano at 800 and at
                         # random 480..800 batch sizes; off, every image trains at `resolution`
    batch_size: 8
    grad_accum_steps: 2
    lr: 1.0e-4
    seed: 42
    num_workers: 0   # no loader worker processes: rfdetr makes workers persistent when this is
                     # above 0, and the one cluster fit died in teardown on a dead persistent
                     # worker. Loading measured ~28 ms per ~1000 px image, ~2 s an epoch against
                     # ~6 s epochs on the one cluster fit.
    early_stopping: true
    early_stopping_patience: 30
    device: cuda

  eval:
    mlflow_experiment: clinical-roi/core-eval
    split: test
    co_occurrence: false
    imgsz: 640        # the network input size; keep it equal to train.resolution
    conf: 0.25
    worst_n: 24
