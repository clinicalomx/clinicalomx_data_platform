name: drift

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: The extract extra is listed only in its pyproject
        run: uv run --no-project --python 3.12 python tools/drift/extract_extra.py

      - name: No specimen accession is tracked
        run: uv run --no-project --python 3.12 python tools/drift/specimen_names.py

  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: No site fact, credential shape, SCT content or notebook is tracked
        run: uv run --no-project --python 3.12 python tools/drift/publication.py

      - name: gitleaks finds nothing outside .gitleaksignore
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          if ! "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner -f json -r "$RUNNER_TEMP/gitleaks.json"; then
            jq -r '.[] | "\(.File):\(.StartLine): gitleaks/\(.RuleID)"' "$RUNNER_TEMP/gitleaks.json"
            exit 1
          fi

      - name: detect-secrets finds nothing outside .secrets.baseline
        if: ${{ !cancelled() }}
        run: git ls-files -z | xargs -0 uvx --from detect-secrets@1.5.0 detect-secrets-hook --baseline .secrets.baseline
