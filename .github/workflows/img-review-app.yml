# Builds the image for qptiff pipeline review app frontend and backend.
name: img-review-app

on:
  push:
    branches: [main]
    paths:
      - "packages/clinicalomx_pipelines/qptiff_pipeline/src/**"
      - "!packages/clinicalomx_pipelines/qptiff_pipeline/src/qptiff_pipeline/flows/**"
      - "packages/clinicalomx_pipelines/qptiff_pipeline/Dockerfile.review"
      - "packages/clinicalomx_pipelines/pyproject.toml"
      - ".github/workflows/img-review-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: astral-sh/setup-uv@v5
      - name: Build the clinicalomx wheel into the build context
        working-directory: .
        run: uv build --wheel --out-dir packages/clinicalomx_pipelines/dist packages/clinicalomx

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/clinicalomx-review-app
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.sha }}

      - uses: docker/build-push-action@v6
        with:
          context: packages/clinicalomx_pipelines
          file: packages/clinicalomx_pipelines/qptiff_pipeline/Dockerfile.review
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
