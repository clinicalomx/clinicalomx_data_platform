# CI for packages/clinicalomx_ledger
name: pkg-clinicalomx-ledger

on:
  push:
    branches: [main]
    paths:
      - "packages/clinicalomx_ledger/**"
      - "packages/clinicalomx/**"
      - ".github/workflows/pkg-clinicalomx-ledger.yml"
  pull_request:
    paths:
      - "packages/clinicalomx_ledger/**"
      - "packages/clinicalomx/**"
      - ".github/workflows/pkg-clinicalomx-ledger.yml"

defaults:
  run:
    working-directory: packages/clinicalomx_ledger

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Tests
        run: uv run --locked pytest -q

      - name: Lint
        run: uv run ruff check --no-cache .
