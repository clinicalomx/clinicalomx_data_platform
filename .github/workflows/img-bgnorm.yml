# Builds the bgnorm image for the qptiff_pipeline
name: img-bgnorm

on:
  push:
    branches: [main]
    tags: ["clinicalomx-pipeline-v*"]
    paths:
      - "packages/clinicalomx_pipelines/qptiff_pipeline/containers/Dockerfile.bgnorm"
      - ".github/workflows/img-bgnorm.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: packages/clinicalomx_pipelines/qptiff_pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # clinicalomx reaches the image as a wheel built from this checkout, never from an index.
      - uses: astral-sh/setup-uv@v5
      - name: Build the clinicalomx wheel into the build context
        working-directory: .
        run: uv build --wheel --out-dir packages/clinicalomx_pipelines/dist packages/clinicalomx

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: basetag
        run: |
          base=$(grep -oiP '^\s*FROM\s+ghcr\.io/bhuvalab/bgnormpy:\K\S+' containers/Dockerfile.bgnorm)
          [ -n "$base" ] || { echo "::error::could not read bgnormpy base tag from Dockerfile.bgnorm FROM line"; exit 1; }
          cx=$(grep -oP '^ARG CLINICALOMX_VERSION=\K\S+' containers/Dockerfile.bgnorm)
          [ -n "$cx" ] || { echo "::error::could not read the clinicalomx version from Dockerfile.bgnorm"; exit 1; }
          tag="${base}-cx${cx}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "bgnormpy $base + clinicalomx $cx -> bgnorm-inference:$tag"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bgnorm-inference
          tags: |
            type=raw,value=${{ steps.basetag.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: packages/clinicalomx_pipelines
          file: packages/clinicalomx_pipelines/qptiff_pipeline/containers/Dockerfile.bgnorm
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write the environment manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/bgnorm-inference:${{ steps.basetag.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_REF: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}@{1}', github.ref_name, github.sha) }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/env-manifests"
          out="$RUNNER_TEMP/env-manifests/bgnorm-inference.json"
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --arg source_ref "$SOURCE_REF" \
                '$ARGS.named | with_entries(select(.value != ""))' > "$out"
          cat "$out"
          { echo '```json'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: env-manifest-bgnorm-${{ steps.basetag.outputs.tag }}
          path: ${{ runner.temp }}/env-manifests/
          if-no-files-found: error
