# Builds the image containing bioio-qptiff for reading/manipulating
# qptiff images.
name: img-qptiff

on:
  push:
    branches: [main]
    tags: ["clinicalomx-pipeline-v*"]
    paths:
      - "packages/clinicalomx_pipelines/qptiff_pipeline/containers/Dockerfile.qptiff"
      - ".github/workflows/img-qptiff.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: packages/clinicalomx_pipelines/qptiff_pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # clinicalomx reaches the image as a wheel built from this checkout, never from an index.
      - uses: astral-sh/setup-uv@v5
      - name: Build the clinicalomx wheel into the build context
        working-directory: .
        run: uv build --wheel --out-dir packages/clinicalomx_pipelines/dist packages/clinicalomx

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: imagetag
        run: |
          set -euo pipefail
          cx=$(grep -oP '^ARG CLINICALOMX_VERSION=\K\S+' containers/Dockerfile.qptiff)
          bio=$(grep -oP '^ARG BIOIO_QPTIFF_COMMIT=\K\S+' containers/Dockerfile.qptiff)
          [ -n "$cx" ] || { echo "::error::could not read CLINICALOMX_VERSION from Dockerfile.qptiff"; exit 1; }
          [ -n "$bio" ] || { echo "::error::could not read BIOIO_QPTIFF_COMMIT from Dockerfile.qptiff"; exit 1; }
          echo "tag=cx${cx}-bio${bio:0:7}" >> "$GITHUB_OUTPUT"
          echo "clinicalomx $cx + reader ${bio:0:7} -> comx-qptiff:cx${cx}-bio${bio:0:7}"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/comx-qptiff
          tags: |
            type=raw,value=${{ steps.imagetag.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: packages/clinicalomx_pipelines
          file: packages/clinicalomx_pipelines/qptiff_pipeline/containers/Dockerfile.qptiff
          push: true
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test the image
        run: docker run --rm ghcr.io/${{ github.repository_owner }}/comx-qptiff:${{ steps.imagetag.outputs.tag }}

      - name: Install apptainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          url=$(gh api repos/apptainer/apptainer/releases/latest \
            --jq '.assets[] | select(.name | test("^apptainer_[0-9][^-]*_amd64\\.deb$")) | .browser_download_url' | head -1)
          test -n "$url"
          curl -fsSL -o /tmp/apptainer.deb "$url"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends /tmp/apptainer.deb
          sudo apptainer --version

      - name: Build and publish the SIF
        env:
          TAG: ${{ steps.imagetag.outputs.tag }}
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo -E apptainer build "comx-qptiff_${TAG}.sif" \
            "docker://ghcr.io/${{ github.repository_owner }}/comx-qptiff:${TAG}"
          ls -lh "comx-qptiff_${TAG}.sif"
          sudo -E apptainer push "comx-qptiff_${TAG}.sif" \
            "oras://ghcr.io/${{ github.repository_owner }}/comx-qptiff-sif:${TAG}"

      # The digest binding, written where it survives the run. Only the build knows which bytes
      # this tag pushed; a digest resolved later reports whatever the tag points at then, which
      # is not evidence. Registering it against the instance is a production write and belongs to
      # gate 11, so this step stops at the manifest.
      # The ORAS reference is claimed only after the push above succeeded.
      - name: Write the environment manifest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/comx-qptiff:${{ steps.imagetag.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_REF: ${{ github.ref_type == 'tag' && github.ref_name || format('{0}@{1}', github.ref_name, github.sha) }}
          SIF_ORAS_REF: oras://ghcr.io/${{ github.repository_owner }}/comx-qptiff-sif:${{ steps.imagetag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/env-manifests"
          out="$RUNNER_TEMP/env-manifests/comx-qptiff.json"
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --arg source_ref "$SOURCE_REF" \
                --arg sif_oras_ref "$SIF_ORAS_REF" \
                '$ARGS.named | with_entries(select(.value != ""))' > "$out"
          cat "$out"
          { echo '```json'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: env-manifest-qptiff-${{ steps.imagetag.outputs.tag }}
          path: ${{ runner.temp }}/env-manifests/
          if-no-files-found: error
